server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Clean logs: only warn+ for errors, disable access logs
  error_log /var/log/nginx/error.log warn;
  access_log off;

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /env-config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location ~* \.(?:js|mjs|css|json|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
